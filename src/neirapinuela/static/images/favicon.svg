<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neira Pinuela">
  <title>Neira Pinuela</title>
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <style>
    .bg     { fill: #198754; }
    .house  { fill: #ffffff; }
    .text   { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 22px; text-anchor: middle; letter-spacing: -1px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2ecc71; }
    }
  </style>

  <!-- Rounded green tile with fully transparent corners. -->
  <g clip-path="url(#tile)">
    <rect class="bg" x="0" y="0" width="64" height="64"/>

    <!-- House roof sitting above the monogram. -->
    <polygon class="house" points="32,6 10,22 54,22"/>

    <!-- "NP" monogram, slightly below centre to leave room for the roof. -->
    <text class="text" x="32" y="38" dominant-baseline="central">NP</text>
  </g>
</svg>
